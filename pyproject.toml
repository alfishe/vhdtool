[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vhdtool"
version = "1.0.0"
description = "VHD/Raw Disk Image Tool for MiSTer ao486"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["vhd", "disk", "image", "fat", "mister", "ao486", "dos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
vhdtool = "vhdtool.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/vhdtool"
Repository = "https://github.com/yourusername/vhdtool"
Issues = "https://github.com/yourusername/vhdtool/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]
